[package]
name = "ironfix-tagvalue"
description = "Zero-copy FIX tag=value encoding and decoding for IronFix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ironfix-core.workspace = true
thiserror.workspace = true
bytes.workspace = true
smallvec.workspace = true
memchr.workspace = true
itoa.workspace = true

[dev-dependencies]
criterion.workspace = true
dhat.workspace = true

[[bench]]
name = "tagvalue"
harness = false

# Installs dhat as the global allocator to count the allocations of a reused
# Encoder stamping SendingTime (52), so it runs as its own binary without the
# libtest harness: no other test and no harness thread allocates while it
# measures.
[[test]]
name = "sending_time_allocations"
harness = false

# Installs dhat as the global allocator to count the allocations of decoding a
# 100-field message into a reused FieldIndex, as its own binary without the
# libtest harness.
[[test]]
name = "field_index_allocations"
harness = false
