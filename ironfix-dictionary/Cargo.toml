[package]
name = "ironfix-dictionary"
description = "FIX specification parsing and dictionary management for IronFix"
version.workspace = true
edition.workspace = true
authors.workspace = true
# The crate's own code is MIT; the FIX Orchestra repositories it embeds from
# spec/orchestra are Apache-2.0 (spec/orchestra/LICENSE). `make
# check-licences` keeps this in step with what the package publishes.
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The test fixtures are not part of the published package: the QuickFIX
# dictionaries (QuickFIX Software License 1.0, see their README) and the
# tests that include them. The embedded FIX Orchestra repositories under
# spec/orchestra (Apache-2.0) are packaged.
exclude = [
    "tests/fixtures",
    "tests/orchestra_fix44.rs",
    "tests/orchestra_equivalence.rs",
    "tests/orchestra_equivalence",
]

[dependencies]
ironfix-core.workspace = true
thiserror.workspace = true
serde.workspace = true
quick-xml.workspace = true

[dev-dependencies]
ironfix-tagvalue.workspace = true
dhat.workspace = true

# Installs dhat as the global allocator, so it runs as its own binary without
# the libtest harness: no other test or harness thread allocates while it
# measures.
[[test]]
name = "group_reader_allocations"
harness = false

# Measures the Orchestra loader's peak heap at its limits, with dhat as the
# global allocator, so it too runs as its own binary without the harness.
[[test]]
name = "orchestra_memory"
harness = false
