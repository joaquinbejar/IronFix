[package]
name = "ironfix-dictionary"
description = "FIX specification parsing and dictionary management for IronFix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# The FIX Orchestra test fixture is distributed under its own license
# (Apache-2.0, see its README): keep it, and the test that includes it, out
# of the published package.
exclude = ["tests/fixtures/orchestra", "tests/orchestra_fix44.rs"]

[dependencies]
ironfix-core.workspace = true
thiserror.workspace = true
serde.workspace = true
quick-xml.workspace = true

[dev-dependencies]
ironfix-tagvalue.workspace = true
dhat.workspace = true

# Installs dhat as the global allocator, so it runs as its own binary without
# the libtest harness: no other test or harness thread allocates while it
# measures.
[[test]]
name = "group_reader_allocations"
harness = false
