[package]
name = "ironfix-store"
description = "Message persistence and storage for IronFix FIX protocol engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ironfix-core.workspace = true
thiserror.workspace = true
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
parking_lot.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true

[features]
default = ["async"]
# The async surface (issue #221): the `MessageStore` trait, `SyncStoreAdapter`
# and `FileStore`, which pull in `tokio` and `async-trait`. With it off, the
# crate is `SyncMessageStore` plus `MemoryStore`, and neither crate is in its
# normal dependency graph (`make check-store-deps`).
async = ["dep:async-trait", "dep:tokio"]

[dev-dependencies]
tokio.workspace = true
criterion.workspace = true
dhat.workspace = true

[[bench]]
name = "file_store"
harness = false
required-features = ["async"]

# Installs dhat as the global allocator to count the allocations of a store
# call, so it runs as its own binary without the libtest harness: no other
# test and no harness thread allocates while it measures.
[[test]]
name = "allocations"
harness = false
required-features = ["async"]
