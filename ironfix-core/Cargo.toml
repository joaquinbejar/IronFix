[package]
name = "ironfix-core"
description = "Core types, traits, and error definitions for IronFix FIX protocol engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
bytes.workspace = true
smallvec.workspace = true
arrayvec.workspace = true
num-traits.workspace = true
num-derive.workspace = true
rust_decimal.workspace = true
chrono = { workspace = true, optional = true }

[features]
default = []
# `Timestamp::to_datetime` and `TryFrom<chrono::DateTime<Utc>>`. Off by default
# so that chrono (RUSTSEC-2026-0543, unmaintained) is not in a consumer's graph.
chrono = ["dep:chrono"]

[dev-dependencies]
dhat.workspace = true
# The formatter tests compare byte for byte against chrono's `format`.
chrono.workspace = true

# Installs dhat as the global allocator to count the allocations of the
# `Timestamp` formatters, so it runs as its own binary without the libtest
# harness: no other test and no harness thread allocates while it measures.
[[test]]
name = "timestamp_allocations"
harness = false
