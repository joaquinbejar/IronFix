[package]
name = "ironfix-engine"
description = "High-level FIX engine facade for IronFix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ironfix-core.workspace = true
ironfix-session.workspace = true
ironfix-store.workspace = true
ironfix-transport.workspace = true
ironfix-tagvalue.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes.workspace = true
tracing.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[features]
default = []
# TLS for both roles over rustls (ADR-0009): Initiator::connect_tls,
# Acceptor::serve_tls and AcceptorRegistry::serve_tls. Off by default; with it
# off, no TLS crate is in the normal dependency graph (`make check-tls-deps`).
tls = ["dep:rustls", "dep:tokio-rustls"]

[dev-dependencies]
dhat.workspace = true
# The outbound throttle tests (#82) run on a paused clock
# (`#[tokio::test(start_paused = true)]`), which needs `test-util`: a feature
# of a dependency the crate already has, adding no crate.
tokio = { workspace = true, features = ["test-util"] }
# The TLS tests (#81): ring is the crypto provider the tests build their
# rustls configurations with, and rcgen generates the certificates at test
# time, so no private key is committed.
rustls = { workspace = true, features = ["ring"] }
rcgen.workspace = true
# The inbound validation tests (#84, ADR-0031) validate against the embedded
# dictionaries. A dev-dependency only: the engine's normal dependency graph
# stays free of ironfix-dictionary, which reaches it through the
# `ironfix_core::InboundValidator` trait.
ironfix-dictionary.workspace = true
# Captures the warning the `Log` validation policy emits, to check it carries
# no field value. Already in the workspace lock through ironfix-example.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# Installs dhat as the global allocator to count the allocations of the
# reactor's write path, so it runs as its own binary without the libtest
# harness: no other test and no harness thread allocates while it measures.
[[test]]
name = "allocations"
harness = false

# Only meaningful with TLS compiled in.
[[test]]
name = "tls_tests"
required-features = ["tls"]
