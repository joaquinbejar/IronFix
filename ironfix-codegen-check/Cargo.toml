[package]
name = "ironfix-codegen-check"
description = "Compiles the ironfix-codegen data definitions and views of embedded dictionaries under the workspace lints (not published)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# A CI check, not a library: never published, and left out of
# `make publish-all` (PUBLISH_ORDER) and the semver matrix.
publish = false

# The crates the generated code names: rust_decimal for both outputs,
# ironfix-core and ironfix-dictionary for the views.
[dependencies]
ironfix-core.workspace = true
ironfix-dictionary.workspace = true
rust_decimal.workspace = true

# build.rs generates the data definitions of the four embedded dictionaries,
# the views of FIX 4.4, FIX 4.2 and FIXT 1.1, and both outputs from the
# FIX 4.4 Orchestra test fixture.
[build-dependencies]
ironfix-codegen.workspace = true
ironfix-dictionary.workspace = true

# The tests regenerate the Orchestra output to check it is what was compiled.
[dev-dependencies]
ironfix-codegen.workspace = true
ironfix-tagvalue.workspace = true
