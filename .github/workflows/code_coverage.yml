name: Code Coverage Report.

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  code_coverage_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Guarded so a warm cache does not recompile tarpaulin from source on
      # every run, but a cached binary older than 0.37.5 (which cannot read
      # Rust 1.99+ coverage data) is replaced.
      - name: Install Tarpaulin
        run: |
          v=$(cargo tarpaulin --version 2>/dev/null | awk '{print $NF}')
          if [ -z "$v" ] || [ "$(printf '%s\n' 0.37.5 "$v" | sort -V | head -n1)" != "0.37.5" ]; then
            cargo install cargo-tarpaulin --locked --version '>=0.37.5'
          fi

      # `benches/**` is excluded: the criterion harness is measurement code, not
      # library code, and counting it would inflate the coverage figure.
      # The llvm engine is explicit: with Rust 1.99 and tarpaulin 0.37.5 the
      # Linux default (ptrace) produces spurious test failures and a segfault;
      # llvm is also what `make coverage` uses on macOS.
      - name: Generate code coverage report
        run: >
          LOGLEVEL=WARN cargo tarpaulin
          --engine llvm
          --exclude-files 'benches/**'
          --all-features
          --workspace
          --timeout 180
          --out Xml

      - name: Upload coverage reports to Codecov.io
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
