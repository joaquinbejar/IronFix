[package]
name = "ironfix-sofh"
description = "Simple Open Framing Header (SOFH) codec for IronFix: frames SBE and other encodings on a byte stream"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Framing never interprets the payload, so there is deliberately no SBE codec
# here and no internal dependency: the `sofh -> core` edge ADR-0003 planned was
# never used and was dropped (#122, see the ADR's Consequences).
[dependencies]
thiserror.workspace = true
bytes.workspace = true
tokio-util = { workspace = true, optional = true }

# `codec` (default) adds the `tokio_util::codec::{Decoder, Encoder}` impls on
# `SofhCodec`. Without it the crate has no `tokio` in its graph; the sync
# `SofhCodec::decode_frame` / `encode_frame` / `frame_slice` API is always on.
[features]
default = ["codec"]
codec = ["dep:tokio-util"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "sofh_codec"
harness = false
required-features = ["codec"]
